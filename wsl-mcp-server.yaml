server:
  address: 127.0.0.1
  port: 8787
  transport: stdio

execution:
  default_action: allow
  default_timeout_ms: 30000
  max_timeout_ms: 300000
  commands:
    - pattern: "shutdown|reboot|poweroff|halt"
      action: deny
    - pattern: "rm -rf /|mkfs|dd if="
      action: deny
    - pattern: "sudo"
      action: confirm

auth:
  api_key_env: ~

logging:
  dir: .wsl-mcp-logs
  persist: false

path_mappings:
  - from_prefix: "C:\\Users\\"
    to_prefix: "/mnt/c/Users/"
  - from_prefix: "D:\\"
    to_prefix: "/mnt/d/"
